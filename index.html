<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c2d">
<title>Classic Kairo Futsal Club</title>
<style>
:root{color-scheme:dark;--bg:#080e19;--panel:#101c2d;--soft:#192b43;--line:#30435e;--gold:#ffd36a;--text:#f1f5fb;--muted:#b7c6da;--red:#ff7886;--green:#49d992}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}h1,h2,h3,p{margin:0 0 .65rem}h1{font-size:clamp(1.5rem,5vw,2rem)}h2{font-size:1.15rem}h3{font-size:1rem}
small,.muted{color:var(--muted)}.gold,strong{color:var(--gold)}.warning{color:var(--red)}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{background:var(--panel);padding:14px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line)}.brand{display:grid;justify-items:center;text-align:center;gap:8px;margin:4px 0 18px;font-weight:800;color:var(--gold)}
.logo{display:block;height:auto;max-width:100%}.navbtn{width:100%;text-align:left;display:flex;gap:9px;align-items:center;margin-bottom:4px;background:transparent;color:var(--muted)}.navbtn[aria-current=page]{background:var(--soft);color:var(--gold)}.short{display:none}
main{width:100%;max-width:1160px;min-width:0;padding:clamp(14px,3vw,32px)}.panel,.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.hero{display:flex;align-items:center;gap:clamp(10px,4vw,26px);background:linear-gradient(145deg,#203658,#101c2d);border-color:#776343}.hero .logo{width:clamp(78px,25vw,142px);flex:none}.hero h2{color:var(--gold);font-size:clamp(1.1rem,4vw,1.9rem);line-height:1.2}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}.stats{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}.stat strong{display:block;font-size:1.6rem}.mt{margin-top:12px}
button,input,select{font:inherit}button{border:0;border-radius:9px;padding:8px 12px;background:var(--gold);color:#221805;font-weight:750;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.danger{background:var(--red);color:#27060c}.share{background:var(--green);color:#062319}:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
input,select{padding:8px 10px;max-width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}input[type=number]{width:6.5rem}label.field{display:grid;gap:5px;margin:8px 0}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th,td{padding:8px;border-bottom:1px solid var(--line)}th{font-size:.84rem;color:var(--muted)}
.timer{text-align:center;font-size:clamp(2.6rem,12vw,5rem);font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;text-align:center;overflow-wrap:anywhere}.score{font-size:clamp(1.4rem,7vw,3.5rem);font-weight:900;color:var(--gold)}.goals{padding:0;list-style:none}.goals li{margin:5px 0}.goals button{padding:2px 6px}.center{justify-content:center;text-align:center}
dialog{width:min(680px,calc(100% - 24px));max-height:85vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px}dialog::backdrop{background:#000a}.notice{background:var(--soft);border-left:3px solid var(--red);padding:10px;margin:10px 0}#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);z-index:5;background:var(--gold);color:#201704;border-radius:9px;padding:9px 13px;font-weight:700}[hidden]{display:none!important}
@media(max-width:800px){.shell{display:block}nav{position:fixed;inset:auto 0 0;height:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;z-index:4;padding:4px 3px calc(4px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line)}.brand,.long{display:none}.short{display:block}.navbtn{display:grid;justify-items:center;text-align:center;gap:0;font-size:.6rem;padding:7px 0;margin:0}.icon{font-size:1rem}main{padding-bottom:calc(85px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="shell"><nav id="nav" aria-label="Main navigation"></nav><main id="main"></main></div>
<dialog id="modal"><div id="modalBody"></div><p id="modalMsg" class="warning" role="status" hidden></p></dialog>
<div id="toast" role="status" hidden></div>
<script>
'use strict';
const DB_KEY='futsal_tournament_v1', HIST_KEY='futsal_history_v1', LOGO='./logo-kairo.png';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const arg=v=>esc(JSON.stringify(v));
const uid=()=>globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2);
const defaults=()=>({matchMinutes:10,teamCount:4,rentalMinutes:120,bufferMinutes:15,gapMinutes:2});
const empty=()=>({players:[],teams:[],matches:[],settings:defaults(),sessionStart:null});
const copy=v=>JSON.parse(JSON.stringify(v));
const int=(v,min,max)=>Number.isInteger(v)&&v>=min&&v<=max;
const dateLabel=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const clock=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const defaultName=()=>`Turnamen ${dateLabel(db.sessionStart||Date.now())}`;
let db=empty(), archives=[], rawActive=null, storageReady=true;
try{
  rawActive=localStorage.getItem(DB_KEY);
  const saved=JSON.parse(rawActive||'null');
  const past=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');
  if(saved&&!['players','teams','matches'].every(k=>Array.isArray(saved[k])))throw Error('Invalid tournament data');
  if(!Array.isArray(past))throw Error('Invalid history');
  if(saved)db={...empty(),...saved,settings:{...defaults(),...saved.settings}};
  archives=past;
}catch(e){storageReady=false;console.error(e)}
let page=0, selectedMatch='', archiveDraft='', lateDraft=null, toastTimer;
const pages=[
  ['Dashboard','Home','📊'],['Players','Players','👥'],['Team Generator','Teams','🛡️'],
  ['Match Schedule','Schedule','📅'],['Live Scoreboard','Live','⏱️'],
  ['League Standings','League','🏆'],['Top Scorers','Scorers','⚽'],['History','History','🗂️']
];
function toast(text){
  if($('modal').open){$('modalMsg').textContent=text;$('modalMsg').hidden=false;return}
  $('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('toast').hidden=true,4000);
}
function openModal(html){
  $('modalBody').innerHTML=html;$('modalMsg').hidden=true;
  if(!$('modal').open)$('modal').showModal();
}
function closeModal(){$('modal').close()}
function go(n){page=n;render();window.scrollTo(0,0)}
function openMatch(id){selectedMatch=id;go(4)}
function persist(next){
  if(localStorage.getItem(DB_KEY)!==rawActive)throw Error('STALE');
  const json=JSON.stringify(next);
  localStorage.setItem(DB_KEY,json);rawActive=json;db=next;
}
function update(change){
  if(!storageReady)return false;
  try{const next=copy(db);change(next);persist(next);return true}
  catch(e){console.error(e);toast(e.message==='STALE'?'Data changed in another tab. Reload before continuing.':'Could not save. Existing data was not changed.');return false}
}
const team=id=>db.teams.find(t=>t.id===id);
const player=id=>db.players.find(p=>p.id===id);
const match=id=>db.matches.find(m=>m.id===id);
const teamName=id=>team(id)?.name||'Unknown team';
const goals=m=>Array.isArray(m.goals)?m.goals:[];
const score=(m,id)=>goals(m).filter(g=>g.teamId===id).length;
const finished=()=>db.matches.filter(m=>m.status==='FINISHED');
const isFinal=()=>db.matches.length>0&&finished().length===db.matches.length;
const hasActive=()=>db.players.length||db.teams.length||db.matches.length||db.sessionStart;
const seasonLocked=()=>db.matches.some(m=>m.started||goals(m).length||m.status!=='UPCOMING');
const editable=m=>m.status==='UPCOMING'&&!m.started&&!goals(m).length;
const defaultSeconds=()=>60*(Number(db.settings.matchMinutes)||10);
const planned=m=>Number(m.durationSeconds)>0?Number(m.durationSeconds):defaultSeconds();
const remaining=m=>Math.max(0,(Number(m.timerRemain??planned(m))||0)-
  (m.status==='LIVE'&&m.timerStart?Math.max(0,Math.floor((Date.now()-m.timerStart)/1000)):0));
const timeText=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const durationText=s=>`${Math.floor(s/60)}m${s%60?' '+Math.floor(s%60)+'s':''}`;
const logo=w=>`<img class="logo" src="${LOGO}" width="${w}" alt="Classic Kairo Futsal Club logo">`;
const cancel=`<button type="button" class="secondary" onclick="closeModal()">Cancel</button>`;

function standings(){
  const rows=db.teams.map(t=>({id:t.id,name:t.name,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}));
  const index=new Map(rows.map(r=>[r.id,r]));
  for(const m of finished()){
    const a=index.get(m.teamA),b=index.get(m.teamB);if(!a||!b)continue;
    const x=score(m,m.teamA),y=score(m,m.teamB);
    a.p++;b.p++;a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;
    if(x>y){a.w++;b.l++;a.pts+=3}
    else if(y>x){b.w++;a.l++;b.pts+=3}
    else{a.d++;b.d++;a.pts++;b.pts++}
  }
  rows.forEach(r=>r.gd=r.gf-r.ga);
  return rows.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||String(a.name).localeCompare(String(b.name)));
}
function scorers(){
  const index=new Map();
  for(const m of finished())for(const g of goals(m)){
    const t=team(g.teamId);
    const name=g.playerName||player(g.playerId)?.name||t?.members?.find(p=>p.id===g.playerId)?.name;
    if(!g.playerId||!name)continue;
    if(!index.has(g.playerId))index.set(g.playerId,{name,team:t?.name||'',goals:0});
    index.get(g.playerId).goals++;
  }
  return [...index.values()].sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name));
}
function snapshot(name=defaultName()){
  return {id:uid(),name,date:db.sessionStart||Date.now(),status:isFinal()?'Final':'Partial',
    standings:standings().map(({id,...r})=>r),topScorers:scorers()};
}
const reportStatus=h=>h.status==='Partial'?'Partial':h.status==='Final'?'Final':'Archived';
const headers=['#','Team','P','W','D','L','GF','GA','GD','PTS'];
const standingValues=(r,i)=>[i+1,r.name,r.p,r.w,r.d,r.l,r.gf,r.ga,r.gd??(r.gf-r.ga),r.pts];
const cells=values=>values.map(v=>`<td>${esc(v)}</td>`).join('');
function table(head,rows,none){
  return `<div class="scroll"><table><thead><tr>${head.map(v=>`<th scope="col">${esc(v)}</th>`).join('')}</tr></thead>
  <tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}">${esc(none)}</td></tr>`}</tbody></table></div>`;
}
function standingTable(rows){return table(headers,rows.map((r,i)=>`<tr>${cells(standingValues(r,i))}</tr>`),'No standings yet.')}
function ranked(rows){
  let rank=0;
  return rows.map((r,i)=>{if(!i||r.goals!==rows[i-1].goals)rank=i+1;return [rank,r.name,r.team,r.goals]});
}
function scorerTable(rows){
  return table(['#','Player','Team','Goals'],ranked(rows).map(v=>`<tr>${cells(v)}</tr>`),'No goals recorded.');
}

function dashboard(){
  const live=db.matches.filter(m=>['LIVE','PAUSED'].includes(m.status));
  const stats=[['Players',db.players.length],['Pro',db.players.filter(p=>p.cat==='PRO').length],
    ['Regular',db.players.filter(p=>p.cat!=='PRO').length],['Teams',db.teams.length],
    ['Matches',db.matches.length],['Completed',finished().length],
    ['Remaining',db.matches.length-finished().length],['Goals',db.matches.reduce((n,m)=>n+goals(m).length,0)]];
  return `<h1>Dashboard</h1><div class="hero">${logo(142)}<div><h2>CLASSIC KAIRO<br>FUTSAL CLUB</h2>
    <p class="muted">REUNITE · EST. 2010</p></div></div>
    <div class="grid stats">${stats.map(([k,v])=>`<div class="panel stat"><strong>${v}</strong>${k}</div>`).join('')}</div>
    <section class="panel"><h2>Active Matches</h2>${live.map(m=>`<p class="row">
    <button class="secondary" onclick="openMatch(${arg(m.id)})">Open</button>${esc(teamName(m.teamA))} vs ${esc(teamName(m.teamB))} · ${esc(m.status)}</p>`).join('')||'<p class="muted">No active matches.</p>'}</section>
    <section class="panel"><h2>Reset Tournament</h2>
    <p class="muted">Reset at any time. Only completed matches count toward the archive.</p>
    <button class="danger" onclick="resetStart()" ${hasActive()?'':'disabled'}>Reset Tournament</button></section>`;
}

const category=(value='REGULAR')=>`<option value="REGULAR" ${value!=='PRO'?'selected':''}>Regular</option><option value="PRO" ${value==='PRO'?'selected':''}>Pro</option>`;
const lateButton=()=>`<button class="secondary" onclick="lateForm()" ${db.teams.length?'':'disabled'}>Add Late Player</button>`;
const duplicate=(name,id)=>db.players.some(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase());
function playersPage(){
  return `<h1>Players</h1><section class="panel"><form class="row" onsubmit="addPlayer(event)">
    <input id="playerName" aria-label="Player name" placeholder="Player name" maxlength="100" required>
    <select id="playerCat" aria-label="Category">${category()}</select><button>Add Player</button>
    </form><div class="row mt">${lateButton()}<button class="secondary" onclick="exportCSV()">Export CSV</button>
    <button class="secondary" onclick="$('csvFile').click()">Import CSV</button>
    <input id="csvFile" type="file" accept=".csv,text/csv" hidden onchange="importCSV(event)"></div>
    ${db.teams.length?'<p class="muted mt">Use Add Late Player to put a new player directly into a team.</p>':''}</section>
    <section class="panel"><h2>Player List</h2><input id="search" type="search" aria-label="Search players" placeholder="Search players" oninput="renderPlayerList()">
    <div id="playerList" class="mt"></div></section>`;
}
function renderPlayerList(){
  const q=$('search').value.trim().toLowerCase();
  $('playerList').innerHTML=table(['Name','Category','Team','Actions'],db.players.filter(p=>p.name.toLowerCase().includes(q)).map(p=>{
    const t=db.teams.find(t=>t.members?.some(x=>x.id===p.id));
    return `<tr>${cells([p.name,p.cat,t?.name||'Unassigned'])}<td><div class="row">
    <button class="secondary" onclick="editPlayer(${arg(p.id)})">Edit</button>
    <button class="danger" onclick="deletePlayer(${arg(p.id)})" ${t?'disabled':''}>Delete</button></div></td></tr>`;
  }),'No players found.');
}
function addPlayer(e){
  e.preventDefault();const name=$('playerName').value.trim(),cat=$('playerCat').value;
  if(!name)return;
  if(duplicate(name))return toast('Player already exists.');
  if(update(d=>d.players.push({id:uid(),name,cat})))render();
}
function editPlayer(id){
  const p=player(id);if(!p)return;
  openModal(`<h2>Edit Player</h2><form onsubmit="savePlayer(event,${arg(id)})">
    <label class="field">Name<input id="editName" value="${esc(p.name)}" maxlength="100" required></label>
    <label class="field">Category<select id="editCat">${category(p.cat)}</select></label>
    <div class="row mt"><button>Save</button>${cancel}</div></form>`);
}
function savePlayer(e,id){
  e.preventDefault();const name=$('editName').value.trim(),cat=$('editCat').value;
  if(!name)return;
  if(duplicate(name,id))return toast('Player already exists.');
  if(update(d=>{
    Object.assign(d.players.find(p=>p.id===id),{name,cat});
    for(const t of d.teams)for(const p of t.members||[])if(p.id===id)Object.assign(p,{name,cat});
    for(const m of d.matches)for(const g of goals(m))if(g.playerId===id)g.playerName=name;
  })){closeModal();render()}
}
function deletePlayer(id){
  if(db.teams.some(t=>t.members?.some(p=>p.id===id)))return toast('This player is assigned to a team.');
  if(confirm('Delete this player?')&&update(d=>d.players=d.players.filter(p=>p.id!==id)))render();
}
function lateForm(){
  if(!db.teams.length)return toast('Generate teams first.');
  lateDraft=null;
  openModal(`<h2>Add Late Player</h2><p class="muted">Draw a team without changing the schedule, score or timer.</p>
    <form onsubmit="drawLate(event)"><label class="field">Name<input id="lateName" maxlength="100" required></label>
    <label class="field">Category<select id="lateCat">${category()}</select></label>
    <div class="row mt"><button>Draw Team</button>${cancel}</div></form>`);
}
function drawLate(e){
  e.preventDefault();const name=$('lateName').value.trim(),cat=$('lateCat').value;
  if(!name)return;
  if(duplicate(name))return toast('Player already exists. Edit the existing record instead.');
  const count=t=>(t.members||[]).length;
  const pros=t=>(t.members||[]).filter(p=>p.cat==='PRO').length;
  const low=Math.min(...db.teams.map(count));
  let pool=db.teams.filter(t=>count(t)===low);
  if(cat==='PRO'){
    const lowPro=Math.min(...pool.map(pros));pool=pool.filter(t=>pros(t)===lowPro);
  }
  const t=pool[Math.floor(Math.random()*pool.length)];if(!t)return;
  lateDraft={name,cat,teamId:t.id};
  const playing=db.matches.some(m=>['LIVE','PAUSED'].includes(m.status)&&[m.teamA,m.teamB].includes(t.id));
  openModal(`<h2>Confirm Team Assignment</h2><p><strong>${esc(name)}</strong> → <strong>${esc(t.name)}</strong></p>
    <p>${playing?'This team is playing now. The player can join through a substitution.':'The player will be available for this team’s next match.'}</p>
    <div class="row mt"><button onclick="saveLate()">Confirm Assignment</button>${cancel}</div>`);
}
function saveLate(){
  if(!lateDraft||!team(lateDraft.teamId)||duplicate(lateDraft.name))return toast('Could not confirm this assignment.');
  const {name,cat,teamId}=lateDraft;
  if(update(d=>{
    const p={id:uid(),name,cat};d.players.push(p);
    const t=d.teams.find(t=>t.id===teamId);
    (t.members||=[]).push({...p});
  })){lateDraft=null;closeModal();render();toast(`${name} joined ${teamName(teamId)}.`)}
}
function download(url,name){
  const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
}
function exportCSV(){
  const quote=v=>`"${String(v).replace(/"/g,'""')}"`;
  const csv=['name,category',...db.players.map(p=>[quote(p.name),quote(p.cat)].join(','))].join('\r\n');
  download('data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+csv),'classic-kairo-players.csv');
}
async function importCSV(e){
  const file=e.target.files[0];if(!file)return;
  try{
    const lines=(await file.text()).replace(/^\uFEFF/,'').split(/\r?\n/).slice(1);
    let n=0;
    if(update(d=>{
      const known=new Set(d.players.map(p=>p.name.toLowerCase()));
      for(const line of lines){
        const m=line.match(/^(?:"((?:[^"]|"")*)"|([^,]*)),\s*(?:"([^"]*)"|([^,]*))\s*$/);
        if(!m)continue;
        const name=(m[1]??m[2]).replace(/""/g,'"').trim().slice(0,100);
        if(!name||known.has(name.toLowerCase()))continue;
        d.players.push({id:uid(),name,cat:(m[3]??m[4]).trim().toUpperCase()==='PRO'?'PRO':'REGULAR'});
        known.add(name.toLowerCase());n++;
      }
    })){render();toast(`${n} player(s) imported.`)}
  }catch(err){console.error(err);toast('Could not read this CSV.')}
  finally{e.target.value=''}
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function teamsPage(){
  return `<h1>Team Generator</h1><section class="panel"><form class="row" onsubmit="makeTeams(event)">
    <label>Teams <input id="teamCount" type="number" min="2" max="32" value="${esc(db.settings.teamCount)}" required></label>
    <button ${seasonLocked()?'disabled':''}>${db.teams.length?'Shuffle Teams':'Generate Teams'}</button></form>
    <p class="muted mt">${seasonLocked()?'Teams are locked after play starts. Use Add Late Player for new arrivals.':'Pro players are distributed before regular players.'}</p></section>
    <div class="grid">${db.teams.map(t=>`<section class="panel"><h2>${esc(t.name)} <small>· ${(t.members||[]).length}</small></h2>
    ${(t.members||[]).map(p=>`<p>${esc(p.name)} <small>· ${esc(p.cat)}</small></p>`).join('')}</section>`).join('')}</div>`;
}
function makeTeams(e){
  e.preventDefault();const n=Number($('teamCount').value);
  if(seasonLocked())return toast('Teams are locked.');
  if(!int(n,2,32)||db.players.length<n)return toast('Each team needs at least one player.');
  if(db.matches.length&&!confirm('Generate new teams and clear the current schedule?'))return;
  const teams=Array.from({length:n},(_,i)=>({id:uid(),name:`Tim ${i<26?String.fromCharCode(65+i):i+1}`,members:[]}));
  const pro=shuffle(db.players.filter(p=>p.cat==='PRO'));
  const regular=shuffle(db.players.filter(p=>p.cat!=='PRO'));
  [...pro,...regular].forEach((p,i)=>teams[i%n].members.push({...p}));
  if(update(d=>{d.teams=teams;d.matches=[];d.settings.teamCount=n})){selectedMatch='';render()}
}

function localDateTime(ms){
  const d=new Date(ms),pad=v=>String(v).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function budget(){
  const now=Date.now(),s=db.settings;
  const start=db.sessionStart||now,end=start+s.rentalMinutes*60000,base=Math.max(now,start);
  const remainingMatches=db.matches.filter(m=>m.status!=='FINISHED');
  const unstarted=remainingMatches.filter(editable);
  const committed=remainingMatches.filter(m=>!editable(m)).reduce((n,m)=>n+remaining(m),0);
  const count=db.matches.length?remainingMatches.length:db.teams.length*(db.teams.length-1)/2;
  const variableCount=db.matches.length?unstarted.length:count;
  const gaps=Math.max(0,count-1)*s.gapMinutes*60;
  const reserve=s.bufferMinutes*60;
  const available=Math.floor((end-base)/1000)-gaps-reserve-committed;
  const recommended=variableCount?Math.max(0,Math.floor(available/variableCount/60)):null;
  const play=db.matches.length?committed+unstarted.reduce((n,m)=>n+planned(m),0):count*defaultSeconds();
  const estimate=base+(play+gaps)*1000;
  const over=Math.max(0,Math.ceil((estimate+reserve*1000-end)/60000));
  return {end,estimate,over,recommended,count,variableCount};
}

  return `<p><strong>${db.sessionStart?'Rental ends':'Estimated rental end'}</strong> ${clock(b.end)} ·

}

function matchAction(id,action,automatic=false){
  const m=match(id);if(!m)return;
  const status=m.status;
  if(action==='start'&&(!['UPCOMING','PAUSED'].includes(status)||(status==='PAUSED'&&!remaining(m))))return;
  if(action==='start'&&db.matches.some(x=>x.id!==id&&x.status==='LIVE'))return toast('Pause or finish the other live match first.');
  if(action==='pause'&&status!=='LIVE')return;
  if(action==='reopen'&&(status!=='FINISHED'||!confirm('Reopen this match to correct the result?')))return;
  if(action!=='reopen'&&status==='FINISHED')return;
  if(action==='finish'&&!automatic&&!confirm('Finish this match and record the result?'))return;
  if(action==='reset'&&!confirm('Reset the timer? Recorded goals will be kept.'))return;
  const left=remaining(m),full=planned(m);
  if(!update(d=>{
    const x=d.matches.find(x=>x.id===id);
    x.durationSeconds=full;
    if(action==='start'){
      if(status==='UPCOMING')x.timerRemain=full;
      x.started=true;x.status='LIVE';x.timerStart=Date.now();
      if(!d.sessionStart)d.sessionStart=Date.now();
    }
    if(action==='pause'||action==='finish'){
      x.started=true;x.timerRemain=left;x.timerStart=null;x.status=action==='pause'?'PAUSED':'FINISHED';
      if(!d.sessionStart)d.sessionStart=Date.now();
    }
    if(action==='reset'){x.started=!!x.started||status!=='UPCOMING';x.timerRemain=full;x.timerStart=null;x.status='UPCOMING'}
    if(action==='reopen'){x.started=true;x.timerStart=null;x.status='PAUSED'}
  }))return;
  if([0,3,4,5,6].includes(page))render();
  if(action==='finish')toast('Match finished.');
}

function commitReset(e){
  e.preventDefault();
  if($('resetText').value.trim()!=='RESET')return toast('Type RESET to confirm.');
  if(confirmedState!==resetSignature()){
    resetNameStep();return toast('Match data changed while this dialog was open. Review the archive again.');
  }
  const report=finished().length?snapshot(archiveDraft):null;
  const next={...empty(),settings:{...db.settings}};
  let previous=null,nextArchives=archives,wroteArchive=false;
  try{
    if(localStorage.getItem(DB_KEY)!==rawActive)throw Error('STALE');
    if(report){
      previous=localStorage.getItem(HIST_KEY);
      const existing=JSON.parse(previous||'[]');
      if(!Array.isArray(existing))throw Error('Invalid history');
      nextArchives=[report,...existing];
      localStorage.setItem(HIST_KEY,JSON.stringify(nextArchives));wroteArchive=true;
    }
    persist(next);
  }catch(err){
    console.error(err);
    if(wroteArchive){
      try{
        if(previous===null)localStorage.removeItem(HIST_KEY);
        else localStorage.setItem(HIST_KEY,previous);
      }catch(rollback){
        console.error(rollback);archives=nextArchives;
        return toast('Archive saved, but active data could not be reset. Reload before retrying.');
      }
    }
    return toast(err.message==='STALE'?'Data changed in another tab. Reload before resetting.':'Could not save. Tournament was not reset.');
  }
  archives=nextArchives;selectedMatch='';archiveDraft='';lateDraft=null;
  closeModal();go(0);toast(report?`${report.status} results saved to History.`:'Tournament reset. No archive was created.');
}

    if(navigator.share&&navigator.canShare&&typeof File==='function'){

const expiryAttempts=new Map();
let lastBudgetSecond=-1;
setInterval(()=>{
  if(!storageReady)return;
  const now=Date.now();
  for(const m of db.matches){
    if(m.status!=='LIVE'||!m.timerStart||remaining(m)>0)continue;

    timer.style.color=m.status==='LIVE'&&left<=30?'var(--red)':'var(--gold)';
  }
  const second=Math.floor(now/1000),summary=$('budgetSummary');
  if(summary&&second!==lastBudgetSecond){summary.innerHTML=budgetSummary();lastBudgetSecond=second}
},400);
render();
</script>
