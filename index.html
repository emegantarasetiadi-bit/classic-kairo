<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1424">
<title>Classic Kairo Futsal Club</title>
<style>
:root{color-scheme:dark;--bg:#080e19;--panel:#101c2d;--soft:#18283e;--line:#30435e;--gold:#ffd36a;--text:#f1f5fb;--muted:#aebed4;--red:#ff6977;--green:#48d993}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
h1,h2,h3,p{margin:0 0 .65rem}
h1{font-size:clamp(1.5rem,5vw,2.1rem)}
h2{font-size:1.12rem}
a{color:var(--gold)}
small,.muted{color:var(--muted)}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100dvh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100dvh;overflow:auto}
.brand{display:grid;justify-items:center;text-align:center;color:var(--gold);font-weight:800;gap:8px;margin:4px 0 20px}
.logo{display:block;max-width:100%;height:auto;object-fit:contain}
.nav-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;color:var(--muted);margin-bottom:4px}
.nav-item[aria-current="page"]{background:var(--soft);color:var(--gold)}
main{width:100%;max-width:1160px;padding:clamp(14px,3vw,32px);min-width:0}
.hero,.panel,.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.hero{display:flex;align-items:center;gap:clamp(12px,4vw,28px);background:linear-gradient(140deg,#203657,#101c2d);border-color:#78623c}
.hero .logo{width:clamp(76px,25vw,142px);flex:none}
.hero h2{color:var(--gold);font-size:clamp(1.15rem,4vw,1.9rem);line-height:1.2}
.hero p{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(min(100%,135px),1fr))}
.stat{margin-top:0}
.stat strong{display:block;color:var(--gold);font-size:1.65rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mt{margin-top:12px}
button,input,select{font:inherit}
button{border:0;border-radius:9px;padding:9px 13px;background:var(--gold);color:#1b1405;font-weight:750;cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.12)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.danger{background:var(--red);color:#240509}
.share{background:var(--green);color:#062319}
input,select{max-width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}
label.field{display:grid;gap:6px;margin-top:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}
th,td{padding:9px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.82rem}
.status{color:var(--gold);font-size:.8rem;font-weight:800}
.live{color:var(--red)}
.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start;text-align:center}
.score{font-size:clamp(1.7rem,7vw,3.5rem);color:var(--gold);font-weight:900;font-variant-numeric:tabular-nums}
.timer{text-align:center;font-size:clamp(2.8rem,13vw,5rem);color:var(--gold);font-weight:900;font-variant-numeric:tabular-nums}
.goals{padding:0;list-style:none;overflow-wrap:anywhere}
.goals li{margin:6px 0}
.goals button{padding:2px 6px}
.center{justify-content:center}
dialog{width:min(680px,calc(100% - 24px));max-height:85dvh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px}
dialog::backdrop{background:#000a}
.notice{border-left:3px solid var(--red);padding:8px 10px;background:var(--soft);margin:12px 0}
#toast{position:fixed;z-index:5;left:50%;bottom:72px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:var(--gold);color:#1b1405;border-radius:10px;padding:10px 14px;font-weight:700}
[hidden]{display:none!important}
@media(max-width:800px){
 .shell{display:block}
 nav{position:fixed;inset:auto 0 0;height:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;z-index:4;padding:5px 4px calc(5px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line)}
 .brand{display:none}
 .nav-item{display:grid;justify-items:center;gap:0;padding:7px 0;margin:0;font-size:.6rem;text-align:center}
 .nav-icon{font-size:1rem}
 main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="shell"><nav id="nav" aria-label="Main navigation"></nav><main id="main"></main></div>
<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" role="status" hidden></div>

<script>
'use strict';

const DB_KEY = 'futsal_tournament_v1';
const HIST_KEY = 'futsal_history_v1';
const LOGO = './logo-kairo.png';
const $ = id => document.getElementById(id);
const empty = () => ({players:[], teams:[], matches:[], settings:{matchMinutes:10, teamCount:4}});
const uid = () => globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
})[c]);
const arg = value => esc(JSON.stringify(value));
const logo = width => `<img class="logo" src="${LOGO}" width="${width}" alt="Classic Kairo Futsal Club logo">`;
const dateLabel = value => new Date(value).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});

let db = empty(), archives = [], storageReady = true;
try {
  const active = JSON.parse(localStorage.getItem(DB_KEY) || 'null');
  const history = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
  if (active && !['players','teams','matches'].every(key => Array.isArray(active[key]))) throw Error('Invalid active data');
  if (!Array.isArray(history)) throw Error('Invalid history');
  if (active) db = {...empty(), ...active, settings:{...empty().settings, ...active.settings}};
  archives = history;
} catch (error) {
  storageReady = false;
  console.error(error);
}

let page = 0, selectedMatch = '', archiveDraft = '', toastTimer;
const pages = [
  ['Dashboard','Home','📊'], ['Players','Players','👥'], ['Team Generator','Teams','🛡️'],
  ['Match Schedule','Schedule','📅'], ['Live Scoreboard','Live','⏱️'],
  ['League Standings','League','🏆'], ['Top Scorers','Scorers','⚽'], ['History','History','🗂️']
];

function toast(message) {
  $('toast').textContent = message;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').hidden = true, 3500);
}

// Apply a change only after the browser confirms that it was saved.
function update(change) {
  if (!storageReady) return false;
  try {
    const next = JSON.parse(JSON.stringify(db));
    change(next);
    localStorage.setItem(DB_KEY, JSON.stringify(next));
    db = next;
    return true;
  } catch (error) {
    console.error(error);
    toast('Could not save. Existing data was not changed.');
    return false;
  }
}

function openModal(content) {
  $('modalBody').innerHTML = content;
  if (!$('modal').open) $('modal').showModal();
}
function closeModal() { $('modal').close(); }
function go(index) {
  page = index;
  render();
  window.scrollTo(0,0);
}
function openMatch(id) { selectedMatch = id; go(4); }

const team = id => db.teams.find(t => t.id === id);
const player = id => db.players.find(p => p.id === id);
const teamName = id => team(id)?.name || 'Unknown team';
const goalsOf = match => Array.isArray(match.goals) ? match.goals : [];
const score = (match, id) => goalsOf(match).filter(g => g.teamId === id).length;
const finished = () => db.matches.filter(m => m.status === 'FINISHED');
const isFinal = () => db.matches.length > 0 && finished().length === db.matches.length;
const duration = () => Math.max(1, Number(db.settings.matchMinutes) || 10) * 60;
const defaultName = () => 'Turnamen ' + dateLabel(Date.now());

function standings() {
  const rows = db.teams.map(t => ({id:t.id,name:t.name,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}));
  const index = new Map(rows.map(r => [r.id,r]));
  for (const m of finished()) {
    const a = index.get(m.teamA), b = index.get(m.teamB);
    if (!a || !b) continue;
    const x = score(m,m.teamA), y = score(m,m.teamB);
    a.p++; b.p++;
    a.gf += x; a.ga += y; b.gf += y; b.ga += x;
    if (x > y) { a.w++; b.l++; a.pts += 3; }
    else if (y > x) { b.w++; a.l++; b.pts += 3; }
    else { a.d++; b.d++; a.pts++; b.pts++; }
  }
  rows.forEach(r => r.gd = r.gf - r.ga);
  return rows.sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || a.name.localeCompare(b.name));
}

function scorers(matches = finished()) {
  const index = new Map();
  for (const m of matches) for (const g of goalsOf(m)) {
    const t = team(g.teamId);
    const name = g.playerName || player(g.playerId)?.name ||
      t?.members?.find(p => p.id === g.playerId)?.name;
    if (!g.playerId || !name) continue;
    if (!index.has(g.playerId)) index.set(g.playerId,{name,team:t?.name || '',goals:0});
    index.get(g.playerId).goals++;
  }
  return [...index.values()].sort((a,b) => b.goals-a.goals || a.name.localeCompare(b.name));
}
function snapshot(name = defaultName()) {
  return {id:uid(), name, date:Date.now(),
    standings:standings().map(({id,...r}) => r), topScorers:scorers()};
}

function table(headers, rows, emptyText) {
  return `<div class="scroll"><table><thead><tr>${headers.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.join('') : `<tr><td colspan="${headers.length}">${esc(emptyText)}</td></tr>`}</tbody></table></div>`;
}
const cells = values => values.map(v => `<td>${esc(v)}</td>`).join('');
const standingHeaders = ['#','Team','P','W','D','L','GF','GA','GD','PTS'];
const standingValues = (r,i) => [i+1,r.name,r.p,r.w,r.d,r.l,r.gf,r.ga,r.gd ?? (r.gf-r.ga),r.pts];
function standingTable(rows) {
  return table(standingHeaders, rows.map((r,i) => `<tr>${cells(standingValues(r,i))}</tr>`), 'No standings yet.');
}
function scorerTable(rows) {
  let rank = 0;
  return table(['#','Player','Team','Goals'], rows.map((r,i) => {
    if (!i || r.goals !== rows[i-1].goals) rank = i+1;
    return `<tr>${cells([rank,r.name,r.team,r.goals])}</tr>`;
  }), 'No goals recorded.');
}

function dashboard() {
  const done = finished().length;
  const stats = [
    ['Players',db.players.length], ['Pro Players',db.players.filter(p=>p.cat==='PRO').length],
    ['Regular Players',db.players.filter(p=>p.cat==='REGULAR').length],
    ['Teams',db.teams.length], ['Matches',db.matches.length],
    ['Completed',done], ['Remaining',db.matches.length-done],
    ['Goals',db.matches.reduce((n,m)=>n+goalsOf(m).length,0)]
  ];
  const live = db.matches.filter(m => m.status === 'LIVE' || m.status === 'PAUSED');
  return `<h1>Dashboard</h1><div class="hero">${logo(142)}
    <div><h2>CLASSIC KAIRO<br>FUTSAL CLUB</h2><p class="muted">REUNITE · EST. 2010</p></div></div>
    <div class="grid stats mt">${stats.map(([label,value])=>`<div class="stat"><strong>${value}</strong>${label}</div>`).join('')}</div>
    <section class="panel"><h2>Active Matches</h2>${live.map(m=>`<p class="row">
      <button class="secondary" onclick="openMatch(${arg(m.id)})">Open</button>
      ${esc(teamName(m.teamA))} vs ${esc(teamName(m.teamB))}</p>`).join('') || '<p class="muted">No active matches.</p>'}</section>
    <section class="panel"><h2>Reset Tournament</h2><p class="muted">Archive the final standings and top scorers before starting a new week.</p>
      <button class="danger" onclick="resetStart()">Reset Tournament</button></section>`;
}

function playersPage() {
  return `<h1>Players</h1><section class="panel">
    <form class="row" onsubmit="addPlayer(event)">
      <input id="playerName" aria-label="Player name" placeholder="Player name" maxlength="100" required>
      <select id="playerCat" aria-label="Player category"><option value="REGULAR">Regular</option><option value="PRO">Pro</option></select>
      <button>Add Player</button>
    </form>
    <div class="row mt"><button class="secondary" onclick="exportCSV()">Export CSV</button>
    <button class="secondary" onclick="$('csvFile').click()">Import CSV</button>
    <input id="csvFile" type="file" accept=".csv,text/csv" hidden onchange="importCSV(event)"></div>
    </section><section class="panel"><h2>Player List</h2>
    <input id="search" type="search" aria-label="Search players" placeholder="Search players" oninput="renderPlayerList()">
    <div class="mt" id="playerList"></div></section>`;
}
function renderPlayerList() {
  const q = $('search').value.trim().toLowerCase();
  $('playerList').innerHTML = table(['Name','Category','Actions'],
    db.players.filter(p=>p.name.toLowerCase().includes(q)).map(p=>
      `<tr>${cells([p.name,p.cat])}<td><div class="row">
      <button class="secondary" onclick="editPlayer(${arg(p.id)})">Edit</button>
      <button class="danger" onclick="deletePlayer(${arg(p.id)})">Delete</button></div></td></tr>`),
    'No players found.');
}
function addPlayer(event) {
  event.preventDefault();
  const name = $('playerName').value.trim(), cat = $('playerCat').value;
  if (!name) return;
  if (db.players.some(p=>p.name.toLowerCase()===name.toLowerCase())) return toast('Player already exists.');
  if (update(d=>d.players.push({id:uid(),name,cat}))) render();
}
function editPlayer(id) {
  const p = player(id);
  if (!p) return;
  openModal(`<h2>Edit Player</h2><form onsubmit="savePlayer(event,${arg(id)})">
    <label class="field">Name<input id="editName" value="${esc(p.name)}" maxlength="100" required></label>
    <label class="field">Category<select id="editCat">
    <option value="REGULAR" ${p.cat!=='PRO'?'selected':''}>Regular</option>
    <option value="PRO" ${p.cat==='PRO'?'selected':''}>Pro</option></select></label>
    <div class="row mt"><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`);
}
function savePlayer(event,id) {
  event.preventDefault();
  const name = $('editName').value.trim(), cat = $('editCat').value;
  if (!name) return;
  if (db.players.some(p=>p.id!==id && p.name.toLowerCase()===name.toLowerCase())) return toast('Player already exists.');
  if (update(d=>{
    Object.assign(d.players.find(p=>p.id===id),{name,cat});
    for (const t of d.teams) for (const p of t.members || []) if (p.id===id) Object.assign(p,{name,cat});
    for (const m of d.matches) for (const g of goalsOf(m)) if (g.playerId===id) g.playerName=name;
  })) { closeModal(); render(); }
}
function deletePlayer(id) {
  if (db.teams.some(t=>t.members?.some(p=>p.id===id))) return toast('This player is already assigned to a team.');
  if (confirm('Delete this player?') && update(d=>d.players=d.players.filter(p=>p.id!==id))) render();
}
function download(url, name) {
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.append(a); a.click(); a.remove();
}
function exportCSV() {
  const cell = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = ['name,category',...db.players.map(p=>[cell(p.name),cell(p.cat)].join(','))].join('\r\n');
  download('data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+csv),'classic-kairo-players.csv');
}
async function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const lines = (await file.text()).replace(/^\uFEFF/,'').split(/\r?\n/).slice(1);
    let count = 0;
    if (update(d=>{
      const names = new Set(d.players.map(p=>p.name.toLowerCase()));
      for (const line of lines) {
        const match = line.match(/^(?:"((?:[^"]|"")*)"|([^,]*)),\s*(?:"([^"]*)"|([^,]*))\s*$/);
        if (!match) continue;
        const name = (match[1] ?? match[2]).replace(/""/g,'"').trim().slice(0,100);
        if (!name || names.has(name.toLowerCase())) continue;
        const cat = (match[3] ?? match[4]).trim().toUpperCase()==='PRO'?'PRO':'REGULAR';
        d.players.push({id:uid(),name,cat}); names.add(name.toLowerCase()); count++;
      }
    })) { render(); toast(`${count} player(s) imported.`); }
  } catch (error) { console.error(error); toast('Could not read this CSV.'); }
  finally { event.target.value=''; }
}

function teamsPage() {
  return `<h1>Team Generator</h1><section class="panel">
    <form class="row" onsubmit="makeTeams(event)">
      <label>Teams <input id="teamCount" type="number" min="2" max="32" value="${esc(db.settings.teamCount)}" required></label>
      <button>${db.teams.length?'Shuffle Teams':'Generate Teams'}</button>
    </form><p class="muted mt">Pro players are distributed across teams before regular players.</p>
    </section><div class="grid">${db.teams.map(t=>`<section class="panel"><h2>${esc(t.name)}</h2>
    ${(t.members||[]).map(p=>`<p>${esc(p.name)} <small>· ${esc(p.cat)}</small></p>`).join('')}</section>`).join('')}</div>`;
}
function shuffle(list) {
  for (let i=list.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]];
  }
  return list;
}
function hasResults() {
  return db.matches.some(m=>m.status!=='UPCOMING'||goalsOf(m).length);
}
function makeTeams(event) {
  event.preventDefault();
  const n = Number($('teamCount').value);
  if (!Number.isInteger(n)||n<2||n>32||db.players.length<n) return toast('Enter a valid team count with at least one player per team.');
  if (hasResults()) return toast('Teams cannot be shuffled after matches have started.');
  if (db.matches.length && !confirm('Generate new teams and clear the current schedule?')) return;
  const teams = Array.from({length:n},(_,i)=>({
    id:uid(),name:`Tim ${i<26?String.fromCharCode(65+i):i+1}`,members:[]
  }));
  const pro = shuffle(db.players.filter(p=>p.cat==='PRO'));
  const regular = shuffle(db.players.filter(p=>p.cat!=='PRO'));
  [...pro,...regular].forEach((p,i)=>teams[i%n].members.push(p));
  if (update(d=>{d.teams=teams;d.matches=[];d.settings.teamCount=n;})) {selectedMatch='';render();}
}

function schedulePage() {
  const rows = db.matches.map(m=>`<tr>
    ${cells([m.matchNo,teamName(m.teamA),teamName(m.teamB),`${score(m,m.teamA)}–${score(m,m.teamB)}`])}
    <td><span class="status ${m.status==='LIVE'?'live':''}">${esc(m.status)}</span></td>
    <td><button class="secondary" onclick="openMatch(${arg(m.id)})">Open</button></td></tr>`);
  return `<h1>Match Schedule</h1><section class="panel">
    <p class="muted">Round robin · ${esc(db.settings.matchMinutes)} minutes per match</p>
    <button onclick="makeSchedule()">${db.matches.length?'Regenerate Schedule':'Generate Schedule'}</button>
    </section><section class="panel">${table(['#','Team A','Team B','Score','Status','Actions'],rows,'Generate teams first, then create a schedule.')}</section>`;
}
function makeSchedule() {
  if (db.teams.length<2) return toast('Generate at least two teams first.');
  if (hasResults()) return toast('The schedule cannot be replaced after matches have started.');
  if (db.matches.length && !confirm('Replace the current schedule?')) return;
  const rotation = shuffle(db.teams.map(t=>t.id));
  if (rotation.length%2) rotation.push(null);
  const matches=[];
  for (let r=0;r<rotation.length-1;r++) {
    for (let i=0;i<rotation.length/2;i++) {
      const a=rotation[i],b=rotation[rotation.length-1-i];
      if (a&&b) matches.push({id:uid(),matchNo:matches.length+1,teamA:a,teamB:b,
        status:'UPCOMING',goals:[],timerStart:null,timerRemain:duration(),elapsed:0});
    }
    rotation.splice(1,0,rotation.pop());
  }
  if (update(d=>d.matches=matches)) {selectedMatch='';render();}
}

function remaining(m) {
  const base=Number(m.timerRemain ?? duration());
  return Math.max(0,base-(m.status==='LIVE'&&m.timerStart ?
    Math.max(0,Math.floor((Date.now()-m.timerStart)/1000)):0));
}
const timeText = seconds => `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;

function scoreboardPage() {
  const m=db.matches.find(x=>x.id===selectedMatch);
  const options=db.matches.map(x=>`<option value="${esc(x.id)}" ${m?.id===x.id?'selected':''}>
    #${esc(x.matchNo)} · ${esc(teamName(x.teamA))} vs ${esc(teamName(x.teamB))}</option>`).join('');
  return `<h1>Live Scoreboard</h1><section class="panel">
    <select aria-label="Select match" onchange="selectedMatch=this.value;render()"><option value="">Select match</option>${options}</select>
    ${m?scoreboard(m):'<p class="muted mt">Select a match to manage the timer and score.</p>'}</section>`;
}
function scoreboard(m) {
  const id=arg(m.id), done=m.status==='FINISHED';
  const action=(type,text,cls='')=>`<button class="${cls}" onclick="matchAction(${id},'${type}')">${text}</button>`;
  function side(teamId) {
    const list=goalsOf(m).filter(g=>g.teamId===teamId);
    return `<div><h3>${esc(teamName(teamId))}</h3>
      ${m.status==='LIVE'||m.status==='PAUSED'?`<button onclick="goalForm(${id},${arg(teamId)})">+ Goal</button>`:''}
      <ul class="goals">${list.map(g=>`<li>${esc(g.minute)}′ ${esc(g.playerName||player(g.playerId)?.name||'Unknown player')}
      ${done?'':`<button class="secondary" aria-label="Remove goal" onclick="removeGoal(${id},${arg(g.id)})">×</button>`}</li>`).join('')}</ul></div>`;
  }
  return `<div class="timer" id="timer">${timeText(remaining(m))}</div>
    <p class="status" style="text-align:center">${esc(m.status)}</p>
    <div class="row center">
      ${m.status==='UPCOMING'?action('start','Start'):''}
      ${m.status==='LIVE'?action('pause','Pause','secondary'):''}
      ${m.status==='PAUSED'?action('start','Resume'):''}
      ${done?'':action('reset','Reset Timer','secondary')+action('finish','Finish Match','danger')}
      ${done?action('reopen','Reopen Match','secondary'):''}
    </div>
    <div class="scoreboard mt">${side(m.teamA)}<div class="score">${score(m,m.teamA)}–${score(m,m.teamB)}</div>${side(m.teamB)}</div>`;
}
function matchAction(id,action,automatic=false) {
  const current=db.matches.find(m=>m.id===id);
  if (!current) return;
  const status=current.status;
  if (action==='start'&&!['PAUSED','UPCOMING'].includes(status)) return;
  if (action==='pause'&&status!=='LIVE') return;
  if (action==='reopen'&&(status!=='FINISHED'||!confirm('Reopen this match to correct the result?'))) return;
  if (action!=='reopen'&&status==='FINISHED') return;
  if (action==='finish'&&!automatic&&!confirm('Finish this match and record the result?')) return;
  if (action==='reset'&&!confirm('Reset the timer? Recorded goals will be kept.')) return;
  const saved=update(d=>{
    const m=d.matches.find(x=>x.id===id);
    if (action==='start') {
      if (status==='UPCOMING'||!remaining(m)) m.timerRemain=duration();
      m.status='LIVE'; m.timerStart=Date.now();
    }
    if (action==='pause'||action==='finish') {
      m.timerRemain=remaining(m);
      m.timerStart=null; m.status=action==='pause'?'PAUSED':'FINISHED';
    }
    if (action==='reset') {
      m.timerRemain=duration(); m.timerStart=null; m.status='UPCOMING';
    }
    if (action==='reopen') {m.timerStart=null;m.status='PAUSED';}
  });
  if (!saved) return;
  if (page===3||page===4||page===5||page===6||page===0) render();
  if (action==='finish') toast('Match finished.');
}
function goalForm(id,teamId) {
  const m=db.matches.find(x=>x.id===id), t=team(teamId);
  if (!m||!t||!['LIVE','PAUSED'].includes(m.status)||![m.teamA,m.teamB].includes(teamId)) return;
  if (!t.members?.length) return toast('This team has no players.');
  const max=Math.ceil(duration()/60);
  const minute=Math.min(max,Math.max(1,Math.ceil((duration()-remaining(m))/60)));
  openModal(`<h2>Goal · ${esc(t.name)}</h2><form onsubmit="saveGoal(event,${arg(id)},${arg(teamId)})">
    <label class="field">Player<select id="goalPlayer">${t.members.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label>
    <label class="field">Minute<input id="goalMinute" type="number" min="0" max="${max}" value="${minute}" required></label>
    <div class="row mt"><button>Save Goal</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`);
}
function saveGoal(event,id,teamId) {
  event.preventDefault();
  const m=db.matches.find(x=>x.id===id), playerId=$('goalPlayer').value;
  const p=team(teamId)?.members?.find(x=>x.id===playerId), minute=Number($('goalMinute').value);
  if (!m||!p||!['LIVE','PAUSED'].includes(m.status)) return toast('This match is no longer accepting goals.');
  if (update(d=>d.matches.find(x=>x.id===id).goals.push({id:uid(),teamId,playerId,playerName:p.name,minute}))) {
    closeModal();render();
  }
}
function removeGoal(id,goalId) {
  const m=db.matches.find(x=>x.id===id);
  if (!m||m.status==='FINISHED'||!confirm('Remove this goal?')) return;
  if (update(d=>{const x=d.matches.find(x=>x.id===id);x.goals=goalsOf(x).filter(g=>g.id!==goalId);})) render();
}

function leaguePage() {
  return `<h1>League Standings</h1><section class="panel">
    <div class="row"><button class="share" onclick="shareLeague()" ${isFinal()?'':'disabled'}>Share Results</button></div>
    <p class="muted mt">${isFinal()?'Share the standings and top scorers as one image.':'Finish all scheduled matches to share the final results.'}</p>
    ${standingTable(standings())}</section>`;
}
function topPage() {
  return `<h1>Top Scorers</h1><section class="panel">
    <p class="muted">Goals from completed matches.</p>${scorerTable(scorers())}</section>`;
}
function historyPage() {
  return `<h1>History</h1><p class="muted">Final standings and top scorers from previous weeks.</p>
    ${archives.map((h,i)=>`<section class="panel"><h2>${esc(h.name)}</h2>
      <p class="muted">${esc(dateLabel(h.date))}</p>
      <button class="secondary" onclick="viewArchive(${i})">View Results</button>
    </section>`).join('')||'<section class="panel">No archived tournaments yet.</section>'}`;
}
function viewArchive(i) {
  const h=archives[i];
  if (!h) return;
  openModal(`<h2>${esc(h.name)}</h2><p class="muted">${esc(dateLabel(h.date))}</p>
    <h3>League Standings</h3>${standingTable(h.standings||[])}
    <h3 class="mt">Top Scorers</h3>${scorerTable(h.topScorers||[])}
    <div class="row mt"><button class="share" onclick="shareArchive(${i})">Share Archived Results</button>
    <button class="secondary" onclick="closeModal()">Close</button></div>`);
}
function resetStart() {
  if (!isFinal()) return toast('Finish all scheduled matches before archiving and resetting.');
  archiveDraft=defaultName();
  resetNameStep();
}
function resetNameStep() {
  openModal(`<h2>Reset Tournament · 1 of 2</h2>
    <p>Only the final standings and top scorers will be archived.</p>
    <form onsubmit="resetConfirm(event)">
      <label class="field">Archive name<input id="archiveName" maxlength="100" value="${esc(archiveDraft)}"></label>
      <div class="row mt"><button>Continue</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div>
    </form>`);
}
function resetConfirm(event) {
  event.preventDefault();
  archiveDraft=$('archiveName').value.trim()||defaultName();
  openModal(`<h2>Reset Tournament · 2 of 2</h2>
    <p>Archive <strong>${esc(archiveDraft)}</strong>?</p>
    <p class="notice">The active players, teams, matches, and goals will be cleared. This cannot be undone.</p>
    <form onsubmit="commitReset(event)">
      <label class="field">Type RESET to confirm<input id="resetText" autocomplete="off" required></label>
      <div class="row mt"><button class="danger">Archive &amp; Reset</button>
      <button type="button" class="secondary" onclick="resetNameStep()">Back</button>
      <button type="button" class="secondary" onclick="closeModal()">Cancel</button></div>
    </form>`);
}
function commitReset(event) {
  event.preventDefault();
  if ($('resetText').value.trim()!=='RESET') return toast('Type RESET to confirm.');
  if (!isFinal()) return toast('The tournament is no longer final.');
  const report=snapshot(archiveDraft);
  const next={...empty(),settings:{...db.settings}};
  let previousHistory, nextHistory;
  try {
    // Refuse a reset if another tab changed the active tournament.
    const saved=JSON.parse(localStorage.getItem(DB_KEY)||'null');
    if (!saved || JSON.stringify({...empty(),...saved,settings:{...empty().settings,...saved.settings}})!==JSON.stringify(db)) {
      return toast('Tournament changed in another tab. Reload before resetting.');
    }
    previousHistory=localStorage.getItem(HIST_KEY);
    const existing=JSON.parse(previousHistory||'[]');
    nextHistory=[report,...existing];
    localStorage.setItem(HIST_KEY,JSON.stringify(nextHistory));
  } catch (error) {
    console.error(error);
    return toast('Could not save the archive. Tournament was not reset.');
  }
  try {
    localStorage.setItem(DB_KEY,JSON.stringify(next));
  } catch (error) {
    console.error(error);
    try {
      if (previousHistory===null) localStorage.removeItem(HIST_KEY);
      else localStorage.setItem(HIST_KEY,previousHistory);
    } catch (rollback) {
      console.error(rollback);
      archives=nextHistory;
      return toast('Archive saved, but active data could not be reset.');
    }
    return toast('Could not reset. Active data was not cleared.');
  }
  archives=nextHistory; db=next; selectedMatch=''; archiveDraft='';
  closeModal(); go(0); toast('Results archived. Ready for a new tournament.');
}

const reportLogo=new Image();
reportLogo.src=LOGO;

function makePNG(report) {
  const standingsRows=report.standings||[], scorerRows=report.topScorers||[];
  const width=1080, rowHeight=58, standingsY=310;
  const scorerY=standingsY+112+Math.max(1,standingsRows.length)*rowHeight;
  const height=scorerY+154+Math.max(1,scorerRows.length)*rowHeight;
  const canvas=document.createElement('canvas');
  canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d');
  if (!ctx) throw Error('Canvas unavailable');
  const gold='#ffd36a', light='#f1f5fb', muted='#b9c9df';
  const bg=ctx.createLinearGradient(0,0,width,height);
  bg.addColorStop(0,'#203657');bg.addColorStop(1,'#080e19');
  function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
  function text(value,x,y,size=28,color=light,weight=500,align='left',max=968){
    ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui, sans-serif`;
    ctx.textAlign=align;ctx.textBaseline='middle';
    ctx.fillText(String(value??''),x,y,max);
  }
  rect(0,0,width,height,bg);rect(0,0,width,10,gold);
  const hasLogo=reportLogo.complete&&reportLogo.naturalWidth>0;
  if (hasLogo) {
    const scale=Math.min(128/reportLogo.naturalWidth,128/reportLogo.naturalHeight);
    const w=reportLogo.naturalWidth*scale,h=reportLogo.naturalHeight*scale;
    ctx.drawImage(reportLogo,56+(128-w)/2,46+(128-h)/2,w,h);
  }
  const titleX=hasLogo?208:56;
  text('CLASSIC KAIRO FUTSAL CLUB',titleX,89,38,gold,800,'left',1024-titleX);
  text('WEEKLY LEAGUE RESULTS',titleX,137,24,muted,700);
  text(report.name,56,208,43,light,800);
  text(dateLabel(report.date),56,254,26,muted);
  const xs=[84,126,480,549,618,687,756,825,894,977];
  const tableHead=(y,title)=>{
    text(title,56,y,33,gold,800);
    rect(56,y+28,968,48,'#2a4262');
  };
  const rowBG=(y,i)=>rect(56,y,968,rowHeight,i%2?'#122138':'#1a2d48');
  tableHead(standingsY,'LEAGUE STANDINGS');
  standingHeaders.forEach((v,i)=>text(v,xs[i],standingsY+52,22,light,800,i===1?'left':'center'));
  standingsRows.forEach((r,i)=>{
    const y=standingsY+76+i*rowHeight;
    rowBG(y,i);
    standingValues(r,i).forEach((v,j)=>text(v,xs[j],y+29,27,
      j===9?gold:light,j===1||j===9?800:500,j===1?'left':'center',j===1?310:65));
  });
  if (!standingsRows.length) text('No standings recorded',76,standingsY+105,26,muted);
  tableHead(scorerY,'TOP SCORERS');
  text('#',84,scorerY+52,22,light,800,'center');
  text('Player',126,scorerY+52,22,light,800);
  text('Team',590,scorerY+52,22,light,800);
  text('Goals',978,scorerY+52,22,light,800,'right');
  let rank=0;
  scorerRows.forEach((r,i)=>{
    if (!i||r.goals!==scorerRows[i-1].goals) rank=i+1;
    const y=scorerY+76+i*rowHeight;
    rowBG(y,i);
    text(rank,84,y+29,26,light,500,'center',48);
    text(r.name,126,y+29,27,light,750,'left',430);
    text(r.team,590,y+29,25,muted,500,'left',280);
    text(r.goals,978,y+29,28,gold,800,'right',78);
  });
  if (!scorerRows.length) text('No goals recorded',76,scorerY+105,26,muted);
  text('CLASSIC KAIRO  ·  EST. 2010',56,height-33,20,muted,700);
  const url=canvas.toDataURL('image/png');
  if (!url.startsWith('data:image/png;base64,')) throw Error('Image too large or unavailable');
  return url;
}

async function shareImage(report) {
  try {
    // Encode synchronously so the native share menu opens from the same tap.
    const url=makePNG(report);
    const stamp=new Date(report.date).toISOString().slice(0,10);
    const name=`classic-kairo-results-${stamp}.png`;
    if (navigator.share&&navigator.canShare&&typeof File==='function') {
      const bytes=Uint8Array.from(atob(url.split(',')[1]),c=>c.charCodeAt(0));
      const payload={files:[new File([bytes],name,{type:'image/png'})]};
      if (navigator.canShare(payload)) {
        try {await navigator.share(payload);return;}
        catch (error) {if (error.name==='AbortError') return;}
      }
    }
    download(url,name);
    toast('PNG downloaded. Attach it in WhatsApp.');
  } catch (error) {
    console.error(error);
    toast('Could not create the image. Please reload and try again.');
  }
}
function shareLeague() {
  if (!isFinal()) return toast('Finish all matches first.');
  return shareImage(snapshot());
}
function shareArchive(i) {
  if (archives[i]) return shareImage(archives[i]);
}

const renderers=[dashboard,playersPage,teamsPage,schedulePage,scoreboardPage,leaguePage,topPage,historyPage];
function render() {
  if (!storageReady) {
    $('main').innerHTML='<h1>Storage unavailable</h1><p>Existing data has not been overwritten. Check browser storage, then reload this page.</p>';
    return;
  }
  $('nav').innerHTML=`<div class="brand">${logo(84)}<span>CLASSIC KAIRO<br>FUTSAL CLUB</span></div>`+
    pages.map(([title,short,icon],i)=>`<button class="nav-item" title="${title}" aria-label="${title}"
      ${page===i?'aria-current="page"':''} onclick="go(${i})"><span class="nav-icon" aria-hidden="true">${icon}</span><span>${short}</span></button>`).join('');
  $('main').innerHTML=renderers[page]();
  if (page===1) renderPlayerList();
}

const expiryAttempts=new Map();
setInterval(()=>{
  if (!storageReady) return;
  const now=Date.now();
  for (const m of db.matches) {
    if (m.status!=='LIVE'||!m.timerStart||remaining(m)>0) continue;
    if (now-(expiryAttempts.get(m.id)||0)<3000) continue;
    expiryAttempts.set(m.id,now);
    matchAction(m.id,'finish',true);
  }
  const m=db.matches.find(x=>x.id===selectedMatch);
  const el=$('timer');
  if (el&&m) {
    const seconds=remaining(m);
    el.textContent=timeText(seconds);
    el.style.color=seconds<=30&&m.status==='LIVE'?'var(--red)':'var(--gold)';
  }
},350);
render();
</script>
